name: Release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Must equal `channel` in rust-toolchain.toml and the same variable in ci.yml —
  # the CI `hygiene` job fails the build if any of the three drift apart. Without
  # this, a job asking for `stable` installs stable and then has the toolchain
  # file pull a second toolchain on the first cargo call.
  #
  # The `build-rpm` job deliberately opts out via RUSTUP_TOOLCHAIN=1.95.0: its
  # RPM is built on MSRV.
  RUST_TOOLCHAIN: '1.99.0'

# Least privilege by default; jobs that need more (e.g. creating the GitHub
# release) raise it explicitly at the job level.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate Reviewed Fork Tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      sha: ${{ steps.prepare.outputs.sha }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Checkout exact workflow source and all tags
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate manual tag, source version and Russian catalogue
        id: prepare
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/manual-release.py prepare --ref "$SOURCE_REF" --sha "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build-deb:
    name: Build Debian Package
    needs: [prepare]
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libvte-2.91-gtk4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev \
            libdbus-1-dev \
            libssl-dev \
            libasound2-dev \
            pkg-config \
            debhelper \
            devscripts \
            dpkg-dev \
            gettext

      # cargo-auditable embeds a dependency SBOM into the binary, so the shipped
      # file can be scanned post-release with `cargo audit bin <file>` without
      # the source tree. Version-pinned like cargo-machete in ci.yml — a moving
      # upstream must not change the build silently.
      - name: Install cargo-auditable
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-auditable@0.7.7

      - name: Validate complete Russian catalogue
        run: |
          msgcmp po/ru.po po/rustconn.pot
          bash scripts/check-po-complete.sh ru

      - name: Build release binary
        run: cargo auditable build --release --locked -p rustconn -p rustconn-cli --features full

      - name: Create deb package structure
        run: |
          VERSION="$RELEASE_VERSION"
          PKG_DIR="rustconn_${VERSION}_amd64"
          
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/usr/share/applications"
          mkdir -p "${PKG_DIR}/usr/share/metainfo"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/128x128/apps"
          mkdir -p "${PKG_DIR}/usr/share/doc/rustconn"
          
          # Binaries
          cp target/release/rustconn "${PKG_DIR}/usr/bin/"
          cp target/release/rustconn-cli "${PKG_DIR}/usr/bin/"
          
          # Desktop file and metadata
          cp rustconn/assets/io.github.totoshko88.RustConn.desktop "${PKG_DIR}/usr/share/applications/"
          cp rustconn/assets/io.github.totoshko88.RustConn.metainfo.xml "${PKG_DIR}/usr/share/metainfo/"
          
          # Icons
          cp rustconn/assets/icons/hicolor/scalable/apps/io.github.totoshko88.RustConn.svg \
             "${PKG_DIR}/usr/share/icons/hicolor/scalable/apps/" || true
          for size in 256 128; do
            cp "rustconn/assets/icons/hicolor/${size}x${size}/apps/io.github.totoshko88.RustConn.png" \
               "${PKG_DIR}/usr/share/icons/hicolor/${size}x${size}/apps/" 2>/dev/null || true
          done
          
          # Docs and copyright
          cp README.md LICENSE CHANGELOG.md "${PKG_DIR}/usr/share/doc/rustconn/"
          cp debian/copyright "${PKG_DIR}/usr/share/doc/rustconn/copyright"
          
          # Locale files (compile .po to .mo)
          for po_file in po/*.po; do
            [ -f "$po_file" ] || continue
            lang=$(basename "$po_file" .po)
            mkdir -p "${PKG_DIR}/usr/share/locale/${lang}/LC_MESSAGES"
            msgfmt -o "${PKG_DIR}/usr/share/locale/${lang}/LC_MESSAGES/rustconn.mo" "$po_file"
          done
          
          # Derive the library dependencies from the binaries instead of listing
          # them by hand (issue #313, reported by @philclifford).
          #
          # This package is assembled here and packed with `dpkg-deb --build`, so
          # nothing runs the machinery a normal Debian build would: every runtime
          # library had to be named in the line below, and the list fell behind the
          # binary. `web-embedded` is in the crate's `default` features, so the
          # binary links libwebkitgtk-6.0.so.4 and libjavascriptcoregtk-6.0.so.1,
          # and neither was declared — the package installed and then died in the
          # dynamic linker before main(). Checked against the recursive closure of
          # the old list (266 packages): libasound2t64 was missing too, from the
          # RDP audio feature, and had simply not bitten anyone yet because ALSA is
          # usually already installed.
          #
          # `dpkg-shlibdeps` reads the ELF headers of the staged binaries, maps each
          # soname to the package that ships it, and derives a minimum version from
          # the symbols actually referenced. It must run from the source root, since
          # it reads debian/control — and that file earns its keep here: a version in
          # its Build-Depends raises the derived floor, so `libgtk-4-dev (>= 4.14)`
          # produces `libgtk-4-1 (>= 4.14)` where the symbols alone would only prove
          # 4.12. Verified locally both ways.
          #
          # Two things it cannot know, so they stay declared by hand: openssh-client
          # is a program rather than a library, and Recommends are optional helpers
          # nothing links against. The Recommends list is copied from debian/control,
          # which had five entries where this one had three — the released package
          # was not recommending picocom, the helper serial connections need.
          SHLIB_DEPS="$(dpkg-shlibdeps -O \
              "${PKG_DIR}/usr/bin/rustconn" \
              "${PKG_DIR}/usr/bin/rustconn-cli" \
              | sed 's/^shlibs:Depends=//')"
          if [ -z "${SHLIB_DEPS}" ]; then
            echo "::error::dpkg-shlibdeps produced no dependencies — refusing to ship a package that declares none"
            exit 1
          fi
          case "${SHLIB_DEPS}" in
            *libwebkitgtk*) ;;
            *) echo "::error::libwebkitgtk missing from derived dependencies; issue #313 would recur"; exit 1 ;;
          esac
          echo "Derived Depends: ${SHLIB_DEPS}"

          # Control file
          cat > "${PKG_DIR}/DEBIAN/control" << EOF
          Package: rustconn
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: ${SHLIB_DEPS}, openssh-client
          Recommends: freerdp3-x11 | freerdp3-wayland, tigervnc-viewer, virt-viewer, picocom, libopenh264-8 | libopenh264-7
          Maintainer: ${RELEASE_OWNER} <${RELEASE_OWNER}@users.noreply.github.com>
          Homepage: https://github.com/${RELEASE_REPOSITORY}
          Description: Modern connection manager for Linux — Russian localization fork
           RustConn is a GTK4-based connection manager for SSH, RDP, VNC, and SPICE
           remote connections with support for embedded terminals, connection groups,
           import/export, and secure credential storage. Upstream: Anton Isaiev.
          EOF
          
          # Build deb
          dpkg-deb --build "${PKG_DIR}"
          mkdir -p dist
          mv "${PKG_DIR}.deb" dist/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: dist/rustconn_${{ env.RELEASE_VERSION }}_amd64.deb
          if-no-files-found: error

  build-rpm:
    name: Build RPM Package
    needs: [prepare]
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    # This job installs rustup with --default-toolchain 1.95.0 on purpose (MSRV),
    # and the cargo it then calls is a rustup proxy, so it WOULD read the repo's
    # rust-toolchain.toml and silently build the shipped RPM with 1.99.0 instead.
    # RUSTUP_TOOLCHAIN outranks that file. Keep in sync with the
    # --default-toolchain value in the "Install Rust" step below.
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Install build tools
        run: |
          dnf install -y \
            git \
            curl \
            gcc \
            make \
            pkg-config \
            gtk4-devel \
            vte291-gtk4-devel \
            libadwaita-devel \
            webkitgtk6.0-devel \
            dbus-devel \
            openssl-devel \
            alsa-lib-devel \
            rpm-build \
            ruby-devel \
            rubygems \
            zstd \
            gettext

      - name: Install fpm
        run: gem install fpm

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate complete Russian catalogue
        run: |
          msgcmp po/ru.po po/rustconn.pot
          bash scripts/check-po-complete.sh ru

      - name: Install Rust
        run: |
          set -e
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0 --profile minimal
          source "$HOME/.cargo/env"
          cargo --version
          # Assert rather than just echo. If the job-level RUSTUP_TOOLCHAIN ever
          # goes missing, rust-toolchain.toml silently wins and the shipped RPM
          # is built with the development toolchain while this log still looks
          # healthy — the exact regression this env var exists to prevent. The
          # `msrv` job in ci.yml carries the same assertion.
          actual="$(rustc --version)"
          echo "rustc in effect: $actual"
          case "$actual" in
            *" 1.95."*) ;;
            *) echo "::error::RPM must be built on MSRV 1.95 (got: $actual)"; exit 1 ;;
          esac
          # cargo-auditable embeds a dependency SBOM into the binary (A3). Installed
          # with `cargo install` rather than taiki-e/install-action: this is a
          # Fedora container job with a hand-rolled rustup, not a GitHub-hosted
          # runner, so the prebuilt-binary action is not a safe fit here. Pinned
          # to match the other jobs. --locked uses the repo lockfile.
          cargo install cargo-auditable --locked --version 0.7.7

      - name: Build release binary
        run: |
          source "$HOME/.cargo/env"
          # This container is Fedora 44, which carries GTK 4.20+ and libadwaita
          # 1.9 — but the build passed no version feature at all, so the RPM on
          # every GitHub release shipped the libadwaita 1.5 baseline and could
          # not reach the Command monitoring mode. Detect instead of assuming: a
          # Fedora release number is not a library version, and the container
          # image moves without this file changing.
          #
          # Same ladders as packaging/obs/rustconn.spec, and `--atleast-version`
          # for the same reason — a glob over `--modversion` misses libadwaita
          # 1.10. Names are package-qualified because two -p packages are
          # selected here and `full` belongs to rustconn-cli.
          #
          # Fails safe: if a pkg-config file is missing the ladder yields
          # nothing and the build is exactly what it was before.
          FEATURES="full"
          if pkg-config --atleast-version=1.10 libadwaita-1 2>/dev/null; then
            FEATURES="$FEATURES,rustconn/adw-1-10"
          elif pkg-config --atleast-version=1.8 libadwaita-1 2>/dev/null; then
            FEATURES="$FEATURES,rustconn/adw-1-8"
          elif pkg-config --atleast-version=1.7 libadwaita-1 2>/dev/null; then
            FEATURES="$FEATURES,rustconn/adw-1-7"
          elif pkg-config --atleast-version=1.6 libadwaita-1 2>/dev/null; then
            FEATURES="$FEATURES,rustconn/adw-1-6"
          fi
          if pkg-config --atleast-version=4.24 gtk4 2>/dev/null; then
            FEATURES="$FEATURES,rustconn/gtk-4-24"
          elif pkg-config --atleast-version=4.22 gtk4 2>/dev/null; then
            FEATURES="$FEATURES,rustconn/gtk-4-22"
          elif pkg-config --atleast-version=4.20 gtk4 2>/dev/null; then
            FEATURES="$FEATURES,rustconn/gtk-4-20"
          elif pkg-config --atleast-version=4.18 gtk4 2>/dev/null; then
            FEATURES="$FEATURES,rustconn/gtk-4-18"
          fi
          if pkg-config --atleast-version=0.84 vte-2.91-gtk4 2>/dev/null; then
            FEATURES="$FEATURES,rustconn/vte-0-84"
          elif pkg-config --atleast-version=0.78 vte-2.91-gtk4 2>/dev/null; then
            FEATURES="$FEATURES,rustconn/vte-0-78"
          fi
          echo "=== gtk4 $(pkg-config --modversion gtk4 2>/dev/null)" \
               "| libadwaita $(pkg-config --modversion libadwaita-1 2>/dev/null)" \
               "| vte $(pkg-config --modversion vte-2.91-gtk4 2>/dev/null)" \
               "=> --features $FEATURES ==="
          cargo auditable build --release --locked -p rustconn -p rustconn-cli --features "$FEATURES"

      - name: Create RPM package
        run: |
          source "$HOME/.cargo/env"
          VERSION="$RELEASE_VERSION"
          RPM_PATH="dist/rustconn-${RELEASE_VERSION}-1.x86_64.rpm"
          
          # Create staging directory
          mkdir -p staging/usr/bin
          mkdir -p staging/usr/share/applications
          mkdir -p staging/usr/share/metainfo
          mkdir -p staging/usr/share/icons/hicolor/scalable/apps
          mkdir -p staging/usr/share/icons/hicolor/128x128/apps
          mkdir -p staging/usr/share/icons/hicolor/256x256/apps
          mkdir -p staging/usr/share/doc/rustconn
          mkdir -p dist
          
          # Copy binaries
          cp target/release/rustconn staging/usr/bin/
          cp target/release/rustconn-cli staging/usr/bin/
          cp README.md LICENSE CHANGELOG.md staging/usr/share/doc/rustconn/
          cp debian/copyright staging/usr/share/doc/rustconn/copyright
          
          # Copy desktop file and metadata
          cp rustconn/assets/io.github.totoshko88.RustConn.desktop staging/usr/share/applications/
          cp rustconn/assets/io.github.totoshko88.RustConn.metainfo.xml staging/usr/share/metainfo/
          
          # Copy icons
          cp rustconn/assets/icons/hicolor/scalable/apps/io.github.totoshko88.RustConn.svg \
             staging/usr/share/icons/hicolor/scalable/apps/ 2>/dev/null || true
          for size in 128 256; do
            cp "rustconn/assets/icons/hicolor/${size}x${size}/apps/io.github.totoshko88.RustConn.png" \
               "staging/usr/share/icons/hicolor/${size}x${size}/apps/" 2>/dev/null || true
          done
          
          # Locale files (compile .po to .mo)
          for po_file in po/*.po; do
            [ -f "$po_file" ] || continue
            lang=$(basename "$po_file" .po)
            mkdir -p "staging/usr/share/locale/${lang}/LC_MESSAGES"
            msgfmt -o "staging/usr/share/locale/${lang}/LC_MESSAGES/rustconn.mo" "$po_file"
          done
          
          # Build RPM with fpm
          fpm -s dir -t rpm \
            -n rustconn \
            -v "${VERSION}" \
            --iteration 1 \
            --architecture x86_64 \
            --package "$RPM_PATH" \
            --license "GPL-3.0-or-later" \
            --vendor "Anton Isaiev" \
            --maintainer "${RELEASE_OWNER} <${RELEASE_OWNER}@users.noreply.github.com>" \
            --url "https://github.com/${RELEASE_REPOSITORY}" \
            --description "Modern connection manager for Linux (SSH, RDP, VNC, SPICE), Russian localization fork" \
            --rpm-autoreqprov \
            --depends "gtk4 >= 4.14" \
            --depends "libadwaita" \
            --depends "vte291-gtk4" \
            --depends "openssh-clients" \
            -C staging \
            usr
          
          echo "=== Built RPM packages ==="
          ls -la dist/
          
          # The .deb's defect (issue #313) in the other packaging tool. fpm writes
          # `AutoReqProv: no` unless told otherwise, so rpmbuild's dependency
          # generator never ran and the four --depends above were the whole of
          # Requires: the published 0.21.4 RPM carried zero soname requires and so
          # never named libwebkitgtk-6.0.so.4 or libasound.so.2, both of which the
          # binary links. `--rpm-autoreqprov` turns the generator back on.
          #
          # The explicit --depends stay: a soname cannot express "gtk4 at least
          # 4.14", the floor the v4_14 bindings assert but no referenced symbol
          # proves, and openssh-clients is a program rather than a library.
          echo "=== Requires ==="
          rpm -qp --requires "$RPM_PATH" | sort
          if ! rpm -qp --requires "$RPM_PATH" | grep -q 'libwebkitgtk'; then
            echo "::error::libwebkitgtk absent from RPM Requires — issue #313 would recur"
            exit 1
          fi

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package
          path: dist/rustconn-${{ env.RELEASE_VERSION }}-1.x86_64.rpm
          if-no-files-found: error

  build-appimage:
    name: Build AppImage
    needs: [prepare]
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libvte-2.91-gtk4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev \
            libdbus-1-dev \
            libssl-dev \
            libasound2-dev \
            pkg-config \
            libfuse2 \
            gettext

      - name: Install cargo-auditable
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-auditable@0.7.7

      - name: Validate complete Russian catalogue
        run: |
          msgcmp po/ru.po po/rustconn.pot
          bash scripts/check-po-complete.sh ru

      - name: Build release
        run: cargo auditable build --release --locked -p rustconn -p rustconn-cli --features full

      - name: Download linuxdeploy
        run: |
          # linuxdeploy ships only a "continuous" tag whose artifacts are
          # rebuilt (checksums are not stable) — retry + ELF sanity check.
          # The GTK plugin is a plain script: pin commit + checksum.
          wget -q --tries=5 --waitretry=10 https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          file linuxdeploy-x86_64.AppImage | grep -q 'ELF 64-bit' || { echo "::error::linuxdeploy download is not an ELF binary"; exit 1; }
          GTK_PLUGIN_COMMIT=3b67a1d1c1b0c8268f57f2bce40fe2d33d409cea
          GTK_PLUGIN_SHA256=b0f4cbc684a0103a9651f0955b635eaea0096b3a66c0f5a2c2aa337960375171
          wget -q "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/${GTK_PLUGIN_COMMIT}/linuxdeploy-plugin-gtk.sh"
          echo "${GTK_PLUGIN_SHA256}  linuxdeploy-plugin-gtk.sh" | sha256sum -c -
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/icons/hicolor/128x128/apps
          mkdir -p AppDir/usr/share/metainfo
          
          cp target/release/rustconn AppDir/usr/bin/
          cp target/release/rustconn-cli AppDir/usr/bin/
          cp rustconn/assets/io.github.totoshko88.RustConn.desktop AppDir/usr/share/applications/
          cp rustconn/assets/io.github.totoshko88.RustConn.metainfo.xml AppDir/usr/share/metainfo/
          
          # Copy icons
          cp rustconn/assets/icons/hicolor/scalable/apps/io.github.totoshko88.RustConn.svg \
             AppDir/usr/share/icons/hicolor/scalable/apps/ || true
          for size in 256 128; do
            cp "rustconn/assets/icons/hicolor/${size}x${size}/apps/io.github.totoshko88.RustConn.png" \
               "AppDir/usr/share/icons/hicolor/${size}x${size}/apps/"
          done

          # appimagetool needs the Icon= PNG in the AppDir root to build .DirIcon.
          # Newer appimagetool continuous builds no longer copy it from
          # usr/share/icons themselves, so place it (and .DirIcon) explicitly —
          # otherwise the appimage output plugin fails with ".DirIcon is not valid".
          cp rustconn/assets/icons/hicolor/256x256/apps/io.github.totoshko88.RustConn.png \
             AppDir/io.github.totoshko88.RustConn.png
          cp AppDir/io.github.totoshko88.RustConn.png AppDir/.DirIcon
          
          # Locale files (compile .po to .mo)
          for po_file in po/*.po; do
            [ -f "$po_file" ] || continue
            lang=$(basename "$po_file" .po)
            mkdir -p "AppDir/usr/share/locale/${lang}/LC_MESSAGES"
            msgfmt -o "AppDir/usr/share/locale/${lang}/LC_MESSAGES/rustconn.mo" "$po_file"
          done

      - name: Build AppImage
        run: |
          mkdir -p dist
          OUTPUT="$PWD/dist/RustConn-${RELEASE_VERSION}-x86_64.AppImage" \
            DEPLOY_GTK_VERSION=4 ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin gtk \
            --output appimage
          
          # The output plugin receives the final path; never upload linuxdeploy itself.
          test -f "dist/RustConn-${RELEASE_VERSION}-x86_64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/RustConn-${{ env.RELEASE_VERSION }}-x86_64.AppImage
          if-no-files-found: error

  build-flatpak:
    name: Build Flatpak
    needs: [prepare]
    runs-on: ubuntu-26.04
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate complete Russian catalogue
        run: |
          msgcmp po/ru.po po/rustconn.pot
          bash scripts/check-po-complete.sh ru

      - name: Pin Flatpak to exact reviewed fork source
        run: |
          python3 scripts/manual-release.py pin-flatpak \
            --manifest packaging/flatpak/io.github.totoshko88.RustConn.yml \
            --sha "$SOURCE_SHA" \
            --repository "$RELEASE_REPOSITORY"

      - name: Install flatpak-cargo-generator
        run: |
          pip install aiohttp toml tomlkit

      - name: Generate cargo sources
        run: |
          # Pinned commit + checksum: this script shapes which sources end
          # up in the Flatpak build (supply-chain hygiene)
          FBT_COMMIT=737c0085912f9f7dabf9341d4608e2a77a51a73a
          FBT_SHA256=b373c8ab1a05378ec5d8ed0645c7b127bcec7d2f7a1798694fbc627d570d856c
          wget -q "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/${FBT_COMMIT}/cargo/flatpak-cargo-generator.py"
          echo "${FBT_SHA256}  flatpak-cargo-generator.py" | sha256sum -c -
          chmod +x flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.totoshko88.RustConn.yml
          bundle: RustConn-${{ env.RELEASE_VERSION }}.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          build-bundle: true
          upload-artifact: false

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: RustConn-${{ env.RELEASE_VERSION }}.flatpak
          if-no-files-found: error

  release:
    name: Create Draft Release
    needs: [prepare, build-deb, build-rpm, build-appimage, build-flatpak]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # Provenance permissions are confined to the final, non-building job.
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      SOURCE_REF: ${{ github.ref }}
      SOURCE_SHA: ${{ github.sha }}
      DEB_ASSET: rustconn_${{ needs.prepare.outputs.version }}_amd64.deb
      RPM_ASSET: rustconn-${{ needs.prepare.outputs.version }}-1.x86_64.rpm
      APPIMAGE_ASSET: RustConn-${{ needs.prepare.outputs.version }}-x86_64.AppImage
      FLATPAK_ASSET: RustConn-${{ needs.prepare.outputs.version }}.flatpak
    steps:
      - name: Checkout exact workflow source and all tags
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download deb artifact
        uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: dist/

      - name: Download RPM artifact
        uses: actions/download-artifact@v8
        with:
          name: rpm-package
          path: dist/

      - name: Download AppImage artifact
        uses: actions/download-artifact@v8
        with:
          name: appimage
          path: dist/

      - name: Download Flatpak artifact
        uses: actions/download-artifact@v8
        with:
          name: flatpak
          path: dist/

      - name: Generate SHA256SUMS for exactly four products
        working-directory: dist
        run: |
          set -euo pipefail
          for asset in "$DEB_ASSET" "$RPM_ASSET" "$APPIMAGE_ASSET" "$FLATPAK_ASSET"; do
            test -f "$asset"
            test ! -L "$asset"
          done
          sha256sum -- "$DEB_ASSET" "$RPM_ASSET" "$APPIMAGE_ASSET" "$FLATPAK_ASSET" > SHA256SUMS

      # Attest final filenames, including the four-product checksum manifest.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ env.DEB_ASSET }}
            dist/${{ env.RPM_ASSET }}
            dist/${{ env.APPIMAGE_ASSET }}
            dist/${{ env.FLATPAK_ASSET }}
            dist/SHA256SUMS

      - name: Read original upstream release notes as data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET "repos/totoshko88/RustConn/releases/tags/v${RELEASE_VERSION}" \
            --jq '.body // ""' > upstream-release-body.md

      - name: Generate fork release notes
        run: |
          python3 scripts/manual-release.py notes \
            --tag "$RELEASE_TAG" \
            --repository "$RELEASE_REPOSITORY" \
            --upstream-notes upstream-release-body.md \
            --output release_notes.md

      - name: Revalidate remote tag and create draft without clobbering
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Refresh this tag only: a moved or deleted tag must stop the release.
          git fetch --no-tags origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          python3 scripts/manual-release.py prepare --ref "$SOURCE_REF" --sha "$SOURCE_SHA" > /dev/null
          # `create` fails for an existing release; never upload to or edit one.
          gh release create "$RELEASE_TAG" \
            "dist/$DEB_ASSET" \
            "dist/$RPM_ASSET" \
            "dist/$APPIMAGE_ASSET" \
            "dist/$FLATPAK_ASSET" \
            dist/SHA256SUMS \
            --repo "$RELEASE_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "RustConn-ru $RELEASE_TAG" \
            --notes-file release_notes.md
