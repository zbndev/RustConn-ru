name: CI

on:
  # Run only after the selected revision has been reviewed.
  workflow_dispatch:

# Least privilege: CI only needs to read the repo contents.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Mitigate transient crates.io fetch flakes ("[16] Error in the HTTP2
  # framing layer"): force HTTP/1.1 and retry network operations.
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_NET_RETRY: '10'
  # The development toolchain, pinned so a new stable release cannot turn CI red
  # without a code change. MUST equal `channel` in rust-toolchain.toml and the
  # same variable in release.yml — the `hygiene` job below fails the build if any
  # of the three drift apart.
  #
  # Why this is duplicated here at all: rust-toolchain.toml is honoured by cargo
  # (a rustup proxy) but the install action cannot read it, so if this said
  # `stable` every job would install stable AND then have the toolchain file pull
  # 1.99.0 on the first cargo call — two toolchains downloaded per job.
  #
  # The `msrv` job deliberately does NOT use this; it pins 1.95.0 and overrides
  # the toolchain file with RUSTUP_TOOLCHAIN.
  #
  # Keep the quotes. A future two-component pin like 1.100 would otherwise be
  # parsed by YAML as a float and handed to the action as "1.1". Note that the
  # drift gate would NOT catch that: it reads this line as raw text with sed and
  # would see "1.100" matching the toml. The quoting is the only thing standing
  # between that typo and a silently wrong toolchain.
  RUST_TOOLCHAIN: '1.99.0'

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ runner.os }}-cargo

      - name: Run cargo check
        run: cargo check --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Cheap text-only gates that need no Rust toolchain, so they stay off the
  # cargo matrix and report in seconds.
  hygiene:
    name: Hygiene
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml is the source of truth for the development
      # toolchain, but the install action cannot read it, so the version is
      # mirrored into the workflow `env.RUST_TOOLCHAIN`. Two copies drift; this
      # asserts they have not. Without the gate a bumped toolchain file would
      # leave CI quietly building on the old compiler.
      - name: Toolchain pin matches both workflows
        run: |
          set -euo pipefail
          if [ ! -f rust-toolchain.toml ]; then
            echo "::error::rust-toolchain.toml is missing"
            exit 1
          fi
          file_channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          if [ -z "$file_channel" ]; then
            echo "::error file=rust-toolchain.toml::could not parse [toolchain] channel"
            exit 1
          fi
          echo "rust-toolchain.toml channel: $file_channel"
          rc=0
          # Three copies of this version exist: the toolchain file plus one
          # RUST_TOOLCHAIN per workflow. Check every one, not just this file's.
          for wf in .github/workflows/ci.yml .github/workflows/release.yml; do
            wf_value="$(sed -n "s/^[[:space:]]*RUST_TOOLCHAIN:[[:space:]]*['\"]\{0,1\}\([^'\"[:space:]]*\)['\"]\{0,1\}[[:space:]]*$/\1/p" "$wf" | head -1)"
            if [ -z "$wf_value" ]; then
              echo "::error file=$wf::no RUST_TOOLCHAIN found in workflow env"
              rc=1
              continue
            fi
            echo "$wf RUST_TOOLCHAIN: $wf_value"
            if [ "$wf_value" != "$file_channel" ]; then
              echo "::error file=$wf::RUST_TOOLCHAIN '$wf_value' != rust-toolchain.toml channel '$file_channel' — update both"
              rc=1
            fi
          done
          exit $rc

      # Same genre as the check above: docs/AI_DEVELOPMENT.md declares the files
      # in .kiro/ to be the authoritative inventory and then states how many
      # there are. Both numbers went stale anyway — 14 steering files against an
      # actual 27, 20 hooks against 16. Needs no toolchain, so it runs here.
      - name: AI development doc counts match .kiro/
        run: ./scripts/check-ai-docs.sh

      # typos.toml has been in the repo, fully configured, since before this
      # job existed — with extend-ignore-re for UUIDs, hex salts and commit
      # hashes — but nothing ever ran it. A config without a runner is decoration.
      #
      # Pinned by SHA like every other third-party action here, and to the same
      # version as the locally installed typos-cli (1.50.1) so a CI-only
      # dictionary update cannot produce findings that do not reproduce locally.
      - name: Spell check
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

      # Prebuilt binary, so this job still needs no Rust toolchain. Pinned by
      # SHA — this action downloads and executes a binary, which is the last
      # place to accept a moving tag.
      - name: Install cargo-machete
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          # The tool is version-pinned too, not just the action. An unpinned
          # `cargo-machete` would let a new upstream release turn CI red with no
          # change to this repo — the same failure mode rust-toolchain.toml
          # exists to prevent. Matches the locally installed 0.9.2.
          tool: cargo-machete@0.9.2

      # Invoked as the bare binary rather than `cargo machete` on purpose: going
      # through the cargo proxy would make rust-toolchain.toml pull a whole
      # toolchain into a job that otherwise needs none. Without --with-metadata
      # machete only parses Cargo.toml and greps sources, so no cargo is
      # required. Crates whose import path differs from their package name are
      # declared in each Cargo.toml's [package.metadata.cargo-machete] ignored.
      - name: Unused dependencies
        run: cargo-machete

  i18n:
    name: i18n
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # Guards against Rust-only `\u{...}` escapes in translatable literals.
      # xgettext runs with --language=C and cannot decode them, so the msgid
      # would never match the runtime lookup and the string would silently
      # render untranslated in every locale. No toolchain needed — pure text
      # scan, so this stays a fast job independent of the cargo matrix.
      - name: Check i18n string escapes
        run: ./scripts/check-i18n-escapes.sh

      # Both directions of POTFILES.in rot silently. A stale entry breaks
      # po/update-pot.sh; a missing one means the file's strings are never
      # extracted, so they render untranslated in every locale while every
      # catalogue still reports 100% complete.
      - name: Check POTFILES.in consistency
        run: ./scripts/check-potfiles.sh

      # Not an i18n check, but the same shape and the same reason it is a gate
      # rather than a test: the thing that rots is a connection between a resolver
      # and its callers, which grep can see and a unit test cannot without a GTK
      # window and a real bastion. 0.20.9 shipped the three-tier jump-host
      # resolver, wired the free-text field to it, left all four launchers reading
      # the picker's field directly, and said in its release notes that
      # inheritance "reads the same for every protocol".
      - name: Check the launch paths resolve their bastion
        run: ./scripts/check-jump-host-wiring.sh

      # The GNOME feature ladder (libadwaita/GTK/VTE version -> feature flag) is
      # duplicated in the Homebrew formula, build-rpm and debian.rules because the
      # three build systems share no language. When they drift, a channel ships an
      # old baseline silently — which has happened more than once. This asserts
      # the version thresholds agree across all three.
      - name: Check feature ladders agree across packaging channels
        run: ./scripts/check-feature-ladders.sh

      # Also not i18n, also the same shape. `install_glib_css_warning_filter` in
      # main.rs drops every GLib message containing "Theme parser" or "gtk.css",
      # which was added for a genuine flood from a libadwaita stylesheet newer than
      # the GTK parser reading it — but the predicate matches wording, not origin, so
      # it silenced our own stylesheet too. Four declarations in assets/style.css used
      # `margin-start`/`margin-end`, which GTK's CSS does not have, so those margins
      # had never applied and nothing said so. A runtime filter cannot be narrowed
      # reliably; checking the file where no filter is in the way can. Needs no
      # display, so it belongs in this job rather than the cargo matrix.
      - name: Check the stylesheet parses
        run: |
          sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0
          ./scripts/check-css.sh

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      # The gate the two above cannot be. They check that the manifest lists the
      # right files and that the literals are extractable, then trust the
      # committed template; nothing regenerated it to compare against. So a
      # translatable string absent from po/rustconn.pot passed every i18n gate
      # there was, while rendering in English in every locale — the catalogues
      # were complete with respect to a template that was itself incomplete.
      # 0.20.0 found thirteen strings like that, 0.20.1 three more, 0.20.2 two.
      # Both 0.20.0 and 0.20.1 recorded the gap in the changelog and shipped
      # without closing it.
      - name: Check the POT template matches the sources
        run: ./scripts/check-pot-current.sh

      # Also catches malformed catalogues and format-placeholder mismatches
      # between msgid and msgstr (e.g. a translation that drops a {} argument).
      #
      # Fuzzy entries are the reason this is a gate rather than a report:
      # gettext ignores them and falls back to English, so a fuzzy translation
      # looks identical to a missing one at runtime while --statistics still
      # counts the catalogue as populated. msgmerge also guesses badly — it
      # once rendered "Play on the remote computer" as the German for
      # "Trigger only once, then remove the rule".
      - name: Validate translation catalogues are complete
        run: ./scripts/check-po-complete.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      # Swatinem/rust-cache keys on the toolchain + Cargo.lock + job and prunes
      # stale entries itself, replacing the hand-rolled actions/cache above. It
      # does NOT weaken the false-green guard below: that guard does not trust
      # cache freshness at all — it force-`cargo clean`s the workspace members
      # (so clippy always recompiles them) and then proves a real compile
      # happened by grepping the log for Checking/Compiling. rust-cache restores
      # target/ exactly as the old cache did; the clean runs after restore and
      # removes the workspace crates regardless of how they got there.
      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ runner.os }}-cargo-clippy

      # This gate used to be able to pass without looking at anything. The cache
      # above is keyed on Cargo.lock, so any change that leaves the lock alone —
      # which is most changes — restores a target/ that clippy has already
      # linted, and cargo then reports the units as fresh: `Finished ... in 0.2s`,
      # zero warnings, exit 0. Nineteen warnings accumulated behind that and were
      # only found in 0.20.11, when a lock change forced a real run. Same shape as
      # the 0.20.9 failure, where a gate agreed with a tree the packaging jobs
      # rejected.
      #
      # Dropping target/ from the cache would fix it and make every push rebuild
      # the whole dependency graph. Cleaning only the workspace crates costs
      # seconds instead, and is all the coverage there is to gain: a dependency
      # cannot acquire a new warning without a lock change, and a lock change
      # already misses the cache. The member list is read from Cargo.toml rather
      # than written out here, so a new crate is covered by existing.
      #
      # The other cargo jobs need no equivalent. `cargo check` is a subset of what
      # clippy compiles, so a cached pass there cannot hide anything clippy will
      # not see; the test jobs re-run their binaries regardless of cache state.
      - name: Run clippy
        shell: bash
        run: |
          set -eo pipefail
          members=$(awk '/^members = \[/,/^\]/' Cargo.toml |
              sed -n 's/^[[:space:]]*"\([^"]*\)".*/\1/p')
          if [ -z "$members" ]; then
            echo "::error::could not read [workspace] members from Cargo.toml"
            exit 1
          fi
          clean_args=""
          for m in $members; do clean_args="$clean_args -p $m"; done
          echo "Cleaning workspace crates so clippy re-checks:$clean_args"
          # shellcheck disable=SC2086
          cargo clean $clean_args
          # `shell: bash` plus `set -o pipefail` and not the default shell: the
          # default is `bash -e`, where the exit status of `cargo clippy | tee` is
          # tee's, so a clippy failure would be reported as a pass. A gate piped
          # through tee without pipefail is the same bug in a new place.
          mkdir -p target
          cargo clippy --all-targets -- -D warnings 2>&1 | tee target/ci-clippy.log
          # And prove it happened. If the clean above ever stops working, this
          # turns a silent false green back into a red job.
          #
          # The escapes are stripped first because this workflow sets
          # CARGO_TERM_COLOR=always at the top level, so cargo colours its output
          # even through a pipe and a progress line arrives as
          #   \e[1m\e[92m    Checking\e[0m rustconn-cli v0.21.0 (...)
          # The first escape sits *before* the indentation, so `^[[:space:]]*`
          # cannot reach the verb, and a second sits between the verb and the
          # crate name, so the literal trailing space cannot match either. Both
          # halves of the pattern failed, and the check called a real two-minute
          # recompile "nothing" on the v0.21.0 release commit. A literal ESC byte
          # from printf keeps the sed portable, which matters because
          # scripts/verify.sh runs the same check on macOS.
          #
          # The strip writes a file instead of piping into grep, and that is the
          # whole point rather than a style choice. `grep -q` exits on its first
          # match, so with a pipe the `sed` upstream is still writing into a
          # closed descriptor and dies of SIGPIPE — and this step runs under
          # `set -o pipefail`, which then reports the *pipeline* as failed
          # because the left-hand side died precisely as a result of the
          # right-hand side succeeding. The first attempt at this fix did pipe,
          # and it turned the gate permanently red: `sed: couldn't write 30
          # items to stdout: Broken pipe` followed by the very error the check
          # exists to raise, on a run where clippy had compiled the workspace in
          # 1m 47s and reported zero warnings. No pipeline, no race, and the
          # plain-text log stays on disk for whoever has to read it next.
          esc=$(printf '\033')
          sed "s/${esc}\[[0-9;]*[a-zA-Z]//g" target/ci-clippy.log \
              > target/ci-clippy-plain.log
          if ! grep -qE '^[[:space:]]*(Checking|Compiling) ' target/ci-clippy-plain.log; then
            echo "::error::clippy compiled nothing — this run verified nothing"
            exit 1
          fi

      # rustdoc lints (broken intra-doc links, unclosed HTML, bare URLs) are
      # evaluated only by rustdoc, so the clippy step cannot catch them. Placed in
      # this job to reuse the dependency metadata clippy just built. No
      # --all-features: the same gtk3 / sspi breakage as everywhere else.
      - name: Run rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items

  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ runner.os }}-cargo-test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          # Version-pinned like the other tools in this file.
          tool: cargo-nextest@0.9.146

      # nextest runs each test in its own process with more parallelism and
      # per-test retry/timeout, but it deliberately does NOT run doctests — so
      # the `--doc` leg below is required, not optional, to keep that coverage.
      - name: Run tests
        run: cargo nextest run --workspace

      - name: Run doctests
        run: cargo test --workspace --doc

      - name: Run CLI tests (full features)
        run: cargo nextest run -p rustconn-cli --features full

  test-core:
    name: Test Core (no GUI)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ runner.os }}-cargo-core

      - name: Install cargo-nextest
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest@0.9.146

      # nextest skips doctests; rustconn-core carries runnable doctests, so the
      # --doc leg is required to keep them covered.
      - name: Run core tests
        run: cargo nextest run -p rustconn-core --all-features

      - name: Run core doctests
        run: cargo test -p rustconn-core --all-features --doc

  property-tests:
    name: Property Tests
    runs-on: ubuntu-26.04
    # Property tests alone run ~5 min (argon2 is slow); cold/restored-cache
    # compilation of rustconn-core --all-features adds several more. 10 min
    # was too tight and canceled the step mid-run despite tests passing.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ runner.os }}-cargo-proptest

      - name: Install cargo-nextest
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest@0.9.146

      # A single integration-test target, so no doctest leg is needed here.
      - name: Run property tests
        run: cargo nextest run -p rustconn-core --all-features --test property_tests

  # The `#[ignore]`d GTK tests need a display and one process each (GTK
  # initialises once per process), so `cargo nextest` in the `test` job skips
  # them. Run here under Xvfb, one process per test.
  gui-tests:
    name: GUI tests (Xvfb)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Install Xvfb
        run: sudo apt-get install -y --no-install-recommends xvfb

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ runner.os }}-cargo-gui-tests

      - name: Run the ignored GTK tests
        env:
          GDK_BACKEND: x11
          GTK_A11Y: none
        run: xvfb-run -a scripts/run-ignored-gui-tests.sh

  # Starts the real binary headlessly: catches a startup panic that no unit test
  # reaches (missing resource, bad schema, widget-tree assertion).
  gui-smoke:
    name: GUI smoke (Xvfb)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Install Xvfb
        run: sudo apt-get install -y --no-install-recommends xvfb

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ runner.os }}-cargo-gui-smoke

      - name: Build rustconn
        run: cargo build -p rustconn

      - name: Launch for 10 s and fail on panic
        run: xvfb-run -a scripts/gui-smoke.sh

  # Expands the OBS spec and lints it. Errors fail the job; the filtered warnings
  # and why are in packaging/obs/rustconn.rpmlint.toml.
  rpm-spec:
    name: RPM spec (rpmspec + rpmlint)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install rpm tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm rpmlint

      - name: Expand the spec
        run: rpmspec -P packaging/obs/rustconn.spec > /dev/null

      - name: rpmlint
        run: rpmlint -c packaging/obs/rustconn.rpmlint.toml packaging/obs/rustconn.spec

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-26.04
    # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml, which pins 1.99.0 for
    # development. Without this the toolchain file would win over the
    # `rustup default 1.95.0` that the install action performs, and this job
    # would silently re-test 1.99.0 while still calling itself MSRV.
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.95.0

      - name: Confirm the pinned toolchain did not take over
        run: |
          set -e
          actual="$(rustc --version)"
          echo "rustc in effect: $actual"
          case "$actual" in
            *" 1.95."*) ;;
            *) echo "::error::MSRV job is not running 1.95 (got: $actual)"; exit 1 ;;
          esac

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ runner.os }}-cargo-msrv

      - name: Check MSRV
        run: |
          rustc --version
          cargo check --all-targets

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Runs all checks (advisories, bans, licenses, sources) per deny.toml.
      # This is the single source of truth for RustSec advisories — the
      # advisory ignore list lives in deny.toml [advisories]. (Replaces the
      # separate cargo-audit job, which duplicated that ignore list.)
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  macos-sys:
    name: macOS (-sys crates)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      # The only system library any of the -sys crates needs: rustconn-locale-sys
      # binds gettext. The others are libc, nix and objc2, all pure Rust.
      - name: Install gettext
        run: brew install gettext

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ runner.os }}-cargo-macos-sys

      # Why this job exists, and why it is this small.
      #
      # No job built macOS at all until 0.21.0, and that had already cost
      # something: the rustconn-pty-sys contract test proving the `pre_exec` hook
      # runs in the forked child — the thing that makes SSH password prompts work
      # (#175) — had never passed on macOS. It accepted ENOTTY and EPERM, macOS
      # answers ENODEV for /dev/null, and it went unnoticed until 0.20.11 because
      # the only machine that ran it was the maintainer's. A test guarding
      # `unsafe` that no CI job executes is a test nobody knows the state of.
      #
      # Scoped to the -sys crates rather than the whole workspace on
      # purpose. They hold every `unsafe` block in the repository, they are where
      # the platform differences actually live, and between them they need one
      # Homebrew package. Building the GUI here would mean gtk4, libadwaita, vte3
      # and WebKitGTK from Homebrew for a twenty-minute job, and `web-embedded` is
      # a default feature that cannot build on macOS at all — which is a separate
      # thing worth fixing before this scope grows.
      #
      # rustconn-dock-sys and rustconn-lock-sys are the reason `--all-targets`
      # matters here: off macOS their AppKit calls are `cfg`-ed out and they
      # contain no `unsafe`, so this is the only place their `unsafe` blocks and
      # main-thread guards are compiled and their contract tests are run.
      - name: Clippy the -sys crates
        run: |
          cargo clippy --all-targets \
            -p rustconn-pty-sys \
            -p rustconn-locale-sys \
            -p rustconn-env-sys \
            -p rustconn-dock-sys \
            -p rustconn-lock-sys \
            -- -D warnings

      - name: Test the -sys crates
        run: |
          cargo test \
            -p rustconn-pty-sys \
            -p rustconn-locale-sys \
            -p rustconn-env-sys \
            -p rustconn-dock-sys \
            -p rustconn-lock-sys

  # Require this single gate when reviewing an update branch.
  # Run even when a dependency fails or is cancelled, and propagate that result.

  # Public-API drift check for the rustconn-core library (cargo-semver-checks).
  #
  # ADVISORY, not a merge gate — and the distinction is deliberate, not timidity.
  # rustconn-core is a 0.x library and is NOT published to crates.io; its only
  # consumers are rustconn/rustconn-cli in this same workspace, which catch a real
  # break at compile time. Under SemVer a 0.x crate may break in a minor bump, so
  # a genuine, intended API change (new SecretSettings fields, new SecretError /
  # RdpClientEvent variants — exactly what 0.23.0 adds) legitimately "requires a
  # new major" by the tool's rules while being a perfectly fine 0.x minor. Gating
  # on it would redden every normal release. So this job REPORTS the drift (early
  # warning: make sure the version bump reflects it) via continue-on-error and is
  # intentionally NOT in the ci-success needs — a red here never blocks a merge.
  #
  # Baseline is the latest git tag (the crate has no registry baseline), resolved
  # at runtime; the check is skipped on the first run before any tag exists.
  # --only-explicit-features --features default avoids an all-features rustdoc
  # build that currently trips an upstream `sspi` compile error (not our code) in
  # the rdp-embedded+rd-gateway+gfx-h264 combination.
  semver-core:
    name: Semver (rustconn-core, advisory)
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ runner.os }}-cargo-semver

      - name: Install cargo-semver-checks
        # v2.87.25 or later: v2.87.20 had no prebuilt for cargo-semver-checks 0.51.0 and
        # fell back to a slow cargo-binstall with an "is not supported" warning.
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-semver-checks@0.51.0

      - name: cargo semver-checks (baseline = latest tag)
        shell: bash
        run: |
          set -uo pipefail
          baseline=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$baseline" ]; then
            echo "No git tag found — skipping semver baseline comparison (first release)."
            exit 0
          fi
          echo "Comparing rustconn-core public API against baseline tag: $baseline"
          # Start from a clean extraction dir. cargo-semver-checks clones each
          # baseline tag under target/semver-checks/git-<tag>/; a leftover
          # checkout from a previous run would be a second baseline to walk.
          #
          # About the "Error: ENOENT ... opendir .../tests/trybuild" and
          # ".../tests/target" annotations this job sometimes shows: they are
          # advisory noise, not a failure, and they are NOT emitted by
          # cargo-semver-checks. Verified 2026-10-09 on ubuntu-26.04 (the runner
          # image) with the pinned 0.51.0 — which is the newest release, so there
          # is nothing to upgrade to — against baseline v0.23.6: the run exits 0
          # with "202 checks: 202 pass" and prints no ENOENT at all. Those paths
          # (tests/trybuild, tests/target) do not exist in the baseline tree and
          # never did (git ls-tree v0.23.6 shows no such dirs); the "opendir"
          # wording is Node's, so the lines come from a GitHub-side directory
          # scan over the extracted checkout, not from the Rust tool or from this
          # workflow (nothing here or in install-deps walks those paths). The job
          # is continue-on-error and deliberately outside ci-success, so the
          # annotations never block a merge. Left as-is rather than suppressed:
          # stripping stderr to hide them would also hide a genuine I/O error.
          rm -rf target/semver-checks
          cargo semver-checks \
            --baseline-rev "$baseline" \
            --package rustconn-core \
            --only-explicit-features --features default

  # Feature-combination check (cargo-hack). The text-level `check-feature-ladders.sh`
  # guard proves the GNOME version ladders AGREE across packaging channels, but it
  # does not COMPILE intermediate feature combinations — a combo that builds under
  # `--all-features` and default can still break in between (web-embedded has broken
  # on its own before). This job closes that: it compiles the independent,
  # non-version features of the two library-ish crates in combination.
  #
  # Scope is deliberate, not lazy. Only `rustconn-core` (whose features —
  # system-keyring, vnc-embedded, web-embedded, rdp-embedded, gfx-h264, rd-gateway
  # — are genuinely independent) and `rustconn-cli` (client-launch × keepass-verify
  # × secret-management) go through `--feature-powerset`. The GUI crate `rustconn`
  # is NOT powerset-checked: its adw-1-*/gtk-4-*/vte-0-* features are version
  # ladders that are mutually exclusive in meaning (you link ONE gtk4), so a
  # powerset would multiply the matrix with nonsensical combos while adding no
  # coverage the packaging builds + check-feature-ladders.sh do not already give.
  # `--depth 2` bounds the combinations (pairs) so the runtime stays sane.
  feature-powerset:
    name: Feature powerset
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Cache cargo (rust-cache)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ runner.os }}-cargo-powerset

      - name: Install cargo-hack
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          # Version-pinned like the other tools in this file — a moving upstream
          # must not change what CI checks without a commit here.
          tool: cargo-hack@0.6.45

      - name: cargo hack --feature-powerset (rustconn-core)
        run: cargo hack --package rustconn-core --feature-powerset --depth 2 check

      - name: cargo hack --feature-powerset (rustconn-cli)
        run: cargo hack --package rustconn-cli --feature-powerset --depth 2 check

  # The desktop entry and AppStream metainfo are what software centres show, and
  # a broken one is otherwise found by the Flathub/OBS build after the tag. The
  # desktop file is validated twice: as committed, and as the packages ship it,
  # with the translations from po/ merged in by msgfmt.
  packaging-metadata:
    name: Desktop and AppStream metadata
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils gettext

      - name: Validate the desktop entry (source and translated)
        run: |
          set -euo pipefail
          desktop=rustconn/assets/io.github.zbndev.RustConnRu.desktop
          desktop-file-validate "$desktop"
          out="$(mktemp -d)"
          msgfmt --desktop --template "$desktop" -d po -o "$out/merged.desktop"
          desktop-file-validate "$out/merged.desktop"

      - name: Validate the AppStream metainfo
        run: appstreamcli validate --strict --no-net rustconn/assets/io.github.zbndev.RustConnRu.metainfo.xml

  # Manually evaluate and build against current nixpkgs-unstable; no flake.lock
  # is committed (see docs/INSTALL.md).
  nix:
    name: Nix flake
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: nix flake check
        run: nix flake check --no-build

      - name: Build the default package
        run: nix build --print-build-logs

  ci-success:
    name: CI Success
    runs-on: ubuntu-26.04
    if: ${{ always() }}
    needs:
      - check
      - fmt
      - hygiene
      - i18n
      - clippy
      - test
      - test-core
      - property-tests
      - gui-tests
      - gui-smoke
      - rpm-spec
      - msrv
      - cargo-deny
      - feature-powerset
      - macos-sys
      - packaging-metadata
      - nix
    steps:
      - name: Verify no upstream job failed
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Upstream job results: ${RESULTS}"
          failed=0
          for r in ${RESULTS}; do
            case "$r" in
              success|skipped) ;;
              failure|cancelled)
                echo "::error::an upstream job reported '${r}'"
                failed=1
                ;;
              *)
                echo "::error::an upstream job reported unexpected result '${r}'"
                failed=1
                ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "CI gate: FAIL"
            exit 1
          fi
          echo "CI gate: all upstream jobs passed (or legitimately skipped)"
