<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Monochrome macOS menu-bar variant of the RustConnRu icon.
  Solid black on a transparent background: the tray is registered as
  an NSImage *template*, so AppKit uses only the alpha channel and tints
  the glyph itself (dark on a light menu bar, white on a dark one, dimmed
  when the display is inactive). Colour here would be discarded, so none
  is used. Gear + RDP chevrons, matching the full-colour icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0635E" />
      <stop offset="100%" stop-color="#C43E39" />
    </linearGradient>
    <mask id="gearMask">
      <rect width="256" height="256" fill="black" />
      <!-- Внешний контур шестерни (24 зубца) -->
      <path fill="white" d="
        M 122.4 16.2 L 133.6 16.2 L 136.8 29.8 A 99 99 0 0 1 148.4 31.9 L 154.9 19.6 L 165.7 22.5 L 165.3 36.5 A 99 99 0 0 1 175.8 41.5 L 185.3 31.3 L 194.9 36.8 L 190.9 50.2 A 99 99 0 0 1 199.7 57.7 L 211.5 50.4 L 219.3 58.2 L 212.0 70.0 A 99 99 0 0 1 219.5 78.8 L 232.9 74.8 L 238.4 84.4 L 228.2 93.9 A 99 99 0 0 1 233.2 104.4 L 247.2 104.0 L 250.1 114.8 L 237.8 121.3 A 99 99 0 0 1 239.9 132.9 L 253.5 136.1 L 253.5 147.3 L 239.9 150.5 A 99 99 0 0 1 237.8 162.1 L 250.1 168.6 L 247.2 179.4 L 233.2 179.0 A 99 99 0 0 1 228.2 189.5 L 238.4 199.0 L 232.9 208.6 L 219.5 204.6 A 99 99 0 0 1 212.0 213.4 L 219.3 225.2 L 211.5 233.0 L 199.7 225.7 A 99 99 0 0 1 190.9 233.2 L 194.9 246.6 L 185.3 252.1 L 175.8 241.9 A 99 99 0 0 1 165.3 246.9 L 165.7 260.9 L 154.9 263.8 L 148.4 251.5 A 99 99 0 0 1 136.8 253.6 L 133.6 267.2 L 122.4 267.2 L 119.2 253.6 A 99 99 0 0 1 107.6 251.5 L 101.1 263.8 L 90.3 260.9 L 90.7 246.9 A 99 99 0 0 1 80.2 241.9 L 70.7 252.1 L 61.1 246.6 L 65.1 233.2 A 99 99 0 0 1 56.3 225.7 L 44.5 233.0 L 36.7 225.2 L 44.0 213.4 A 99 99 0 0 1 36.5 204.6 L 23.1 208.6 L 17.6 199.0 L 27.8 189.5 A 99 99 0 0 1 22.8 179.0 L 8.8 179.4 L 5.9 168.6 L 18.2 162.1 A 99 99 0 0 1 16.1 150.5 L 2.5 147.3 L 2.5 136.1 L 16.1 132.9 A 99 99 0 0 1 18.2 121.3 L 5.9 114.8 L 8.8 104.0 L 22.8 104.4 A 99 99 0 0 1 27.8 93.9 L 17.6 84.4 L 23.1 74.8 L 36.5 78.8 A 99 99 0 0 1 44.0 70.0 L 36.7 58.2 L 44.5 50.4 L 56.3 57.7 A 99 99 0 0 1 65.1 50.2 L 61.1 36.8 L 70.7 31.3 L 80.2 41.5 A 99 99 0 0 1 90.7 36.5 L 90.3 22.5 L 101.1 19.6 L 107.6 31.9 A 99 99 0 0 1 119.2 29.8 Z
      " transform="translate(0, -13.7) scale(1, 1)" />
      <!-- Внутренний вырез -->
      <circle cx="128" cy="128" r="80" fill="black" />
      <!-- 5 внутренних приливов под отверстия -->
      <circle cx="128" cy="48" r="15" fill="white" />
      <circle cx="204.1" cy="103.3" r="15" fill="white" />
      <circle cx="175.0" cy="192.7" r="15" fill="white" />
      <circle cx="81.0" cy="192.7" r="15" fill="white" />
      <circle cx="51.9" cy="103.3" r="15" fill="white" />
      <!-- 5 сквозных отверстий -->
      <circle cx="128" cy="48" r="6.5" fill="black" />
      <circle cx="204.1" cy="103.3" r="6.5" fill="black" />
      <circle cx="175.0" cy="192.7" r="6.5" fill="black" />
      <circle cx="81.0" cy="192.7" r="6.5" fill="black" />
      <circle cx="51.9" cy="103.3" r="6.5" fill="black" />
    </mask>
  </defs>

  <!-- Шестерня -->
  <rect width="256" height="256" fill="#000000" mask="url(#gearMask)" />

  <!-- Символ RDP (><) по центру -->
  <g fill="none" stroke="#000000" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="82,94 116,128 82,162" />
    <polyline points="174,94 140,128 174,162" />
  </g>
</svg>